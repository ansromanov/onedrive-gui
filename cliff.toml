# git-cliff: the changelog and the notes of a release from Conventional Commits.
[changelog]
header = "# Changelog\n"
body = """
{% if version %}## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }}){% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }}
{% endfor %}{% endfor %}
"""
trim = true
filter_commit_regex = "\\[skip ci\\]"

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^[a-z]+(\\([^)]*\\))?!:", group = "Breaking changes" },
  { body = "BREAKING CHANGE", group = "Breaking changes" },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^docs", group = "Documentation" },
  { message = "^.*", skip = true },
]
