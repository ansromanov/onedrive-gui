[package]
name = "onedrive-gui-daemon"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "signal", "time"] }
zbus = { version = "6", default-features = false, features = ["tokio", "service"] }
